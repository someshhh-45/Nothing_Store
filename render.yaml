services:
  - type: web
    name: nothing-marketplace
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/public/categories
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: nothing-db
          property: connectionString
      - key: DATABASE_USER
        fromDatabase:
          name: nothing-db
          property: user
      - key: DATABASE_PASSWORD
        fromDatabase:
          name: nothing-db
          property: password
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_COOKIE_SECURE
        value: "true"
      - key: HIBERNATE_DDL_AUTO
        value: "update"
      - key: SEED_RETAIL_CATALOG
        value: "true"
      - key: SEED_OFFERS
        value: "true"
      - key: SEED_COFFEE_CATALOG
        value: "false"
      - key: MAIL_NOTIFICATIONS_ENABLED
        value: "false"
      - key: RETAILER_DISCOUNT_PERCENT
        value: "10"

databases:
  - name: nothing-db
    databaseName: nothing
    user: nothing
