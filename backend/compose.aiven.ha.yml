# Production-oriented Aiven deployment template: real TLS certs and schema are required.
# Still one Docker host and a single RabbitMQ broker: NOT full infrastructure HA.
# Aiven-managed PostgreSQL, Kafka and OpenSearch. Only supporting services run locally.
# Run from repository root:
# docker compose -f backend/compose.aiven.ha.yml --env-file backend/.env.aiven up -d --build --scale app=3
name: nothing-aiven-ha
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    expose: ["8080", "8081"]
    restart: unless-stopped
    stop_grace_period: 40s
    deploy:
      replicas: 3
      resources:
        limits:
          memory: 960M
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:8081/actuator/health/liveness"]
      interval: 10s
      timeout: 4s
      retries: 5
      start_period: 80s
    volumes:
      - ${AIVEN_PG_CA_PATH:?Set Aiven PostgreSQL root CA PEM path}:/etc/ssl/certs/aiven-pg-ca.pem:ro
    environment:
      DATABASE_URL: ${AIVEN_PG_JDBC_URL:?Set AIVEN_PG_JDBC_URL with sslmode=verify-full}
      DATABASE_USER: ${AIVEN_PG_USER:?Set AIVEN_PG_USER}
      DATABASE_PASSWORD: ${AIVEN_PG_PASSWORD:?Set AIVEN_PG_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Set a new Base64 JWT secret}
      MAIL_HEALTH_ENABLED: ${MAIL_HEALTH_ENABLED:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      EMAIL_FROM: ${EMAIL_FROM:-}
      MAIL_PROVIDER: ${MAIL_PROVIDER:-smtp}
      GMAIL_OAUTH_CLIENT_ID: ${GMAIL_OAUTH_CLIENT_ID:-}
      GMAIL_OAUTH_CLIENT_SECRET: ${GMAIL_OAUTH_CLIENT_SECRET:-}
      GMAIL_OAUTH_REFRESH_TOKEN: ${GMAIL_OAUTH_REFRESH_TOKEN:-}
      MAIL_NOTIFICATIONS_ENABLED: ${MAIL_NOTIFICATIONS_ENABLED:-false}
      NOTIFICATION_POLL_MS: ${NOTIFICATION_POLL_MS:-5000}
      NOTIFICATION_BATCH_SIZE: ${NOTIFICATION_BATCH_SIZE:-12}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      RETAILER_DISCOUNT_PERCENT: ${RETAILER_DISCOUNT_PERCENT:-10}
      JWT_COOKIE_SECURE: 'true'
      FRONTEND_URL: ${FRONTEND_URL:?Set public HTTPS URL for your store}
      HIBERNATE_DDL_AUTO: ${HIBERNATE_DDL_AUTO:-validate}
      DB_POOL_MAX: ${DB_POOL_MAX:-5}
      DB_POOL_MIN_IDLE: ${DB_POOL_MIN_IDLE:-1}
      HTTP_MAX_THREADS: ${HTTP_MAX_THREADS:-80}
      SEED_OFFERS: 'false'
      SEED_RETAIL_CATALOG: 'false'
      SEED_COFFEE_CATALOG: "false"
      KAFKA_BOOTSTRAP_SERVERS: ${AIVEN_KAFKA_BOOTSTRAP:?Set AIVEN_KAFKA_BOOTSTRAP}
      KAFKA_SECURITY_PROTOCOL: SASL_SSL
      KAFKA_SASL_MECHANISM: SCRAM-SHA-256
      KAFKA_SASL_JAAS_CONFIG: ${AIVEN_KAFKA_SASL_JAAS_CONFIG:?Set SASL JAAS config}
      OPENSEARCH_URL: ${AIVEN_OPENSEARCH_URL:?Set HTTPS Aiven OpenSearch URL}
      OPENSEARCH_USER: ${AIVEN_OPENSEARCH_USER:?Set OpenSearch username}
      OPENSEARCH_PASSWORD: ${AIVEN_OPENSEARCH_PASSWORD:?Set OpenSearch password}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: nothing
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?Set RabbitMQ password}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_SUCCESS_URL: ${STRIPE_SUCCESS_URL:-http://localhost:8000/?checkout=stripe-success}
      STRIPE_CANCEL_URL: ${STRIPE_CANCEL_URL:-http://localhost:8000/?checkout=stripe-cancel}
    depends_on:
      rabbitmq:
        condition: service_healthy
  frontend:
    image: nginx:1.28-alpine
    volumes:
      - ../nothing-coffee:/usr/share/nginx/html:ro
      - ./nginx.ha-tls.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx.ha-proxy.inc:/etc/nginx/nothing-api-proxy.inc:ro
      - ${TLS_CERT_PATH:?Set absolute path of fullchain PEM}:/etc/nginx/tls/fullchain.pem:ro
      - ${TLS_KEY_PATH:?Set absolute path of TLS private key}:/etc/nginx/tls/privkey.pem:ro
    ports:
      - "${FRONTEND_HTTP_PORT:-80}:80"
      - "${FRONTEND_HTTPS_PORT:-443}:443"
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
  rabbitmq:
    image: rabbitmq:3.13-management
    environment:
      RABBITMQ_DEFAULT_USER: nothing
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Set RabbitMQ password}
    volumes:
      - rabbitdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 6s
      retries: 8
      start_period: 15s
    restart: unless-stopped
  prometheus:
    profiles: ["monitoring"]
    image: prom/prometheus:v2.55.1
    volumes:
      - ./infrastructure/monitoring/prometheus.ha.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    restart: unless-stopped
  grafana:
    profiles: ["monitoring"]
    image: grafana/grafana:11.3.0
    volumes:
      - ./infrastructure/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set Grafana password}
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    restart: unless-stopped

volumes:
  rabbitdata:
