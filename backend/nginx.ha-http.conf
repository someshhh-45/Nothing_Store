# NGINX 1.27.5+ is required for dynamic "resolve" upstreams.
# Docker DNS returns all running app container IPs; the upstream applies
# weighted-equal round robin and refreshes membership every five seconds.
resolver 127.0.0.11 valid=5s ipv6=off;
resolver_timeout 2s;
upstream nothing_app {
    zone nothing_app 64k;
    server app:8080 resolve max_fails=2 fail_timeout=10s;
    keepalive 32;
}
# Avoid logging query strings, cookies and request bodies.
log_format nothing_lb '$remote_addr $request_method $uri '
    'status=$status upstream=$upstream_addr upstream_status=$upstream_status '
    'duration=$request_time';
limit_req_zone $binary_remote_addr zone=nothing_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=nothing_api:10m rate=200r/s;
limit_conn_zone $binary_remote_addr zone=nothing_connections:10m;
limit_req_status 429;
limit_conn_status 429;
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    access_log /var/log/nginx/access.log nothing_lb;
    client_max_body_size 4m;
    location ~ ^/api/auth/(signin|signup|verify-email|resend-code)$ {
        limit_req zone=nothing_auth burst=10 nodelay;
        limit_conn nothing_connections 20;
        include /etc/nginx/nothing-api-proxy.inc;
    }
    location /api/ {
        limit_req zone=nothing_api burst=500 nodelay;
        limit_conn nothing_connections 50;
        include /etc/nginx/nothing-api-proxy.inc;
    }
    location = /index.html {
        add_header Cache-Control "no-store";
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
