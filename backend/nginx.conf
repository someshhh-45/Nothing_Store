server {
  listen 80;
  server_name _;
  # Re-resolve Spring Boot container IPs after Docker rebuild/recreation.
  resolver 127.0.0.11 valid=5s ipv6=off;
  set $backend_upstream app:8080;
  root /usr/share/nginx/html;
  index index.html;
  # Uploaded seller images are served as static files, never executed.
  location ^~ /uploads/ {
    alias /var/www/product-uploads/;
    autoindex off;
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control "public, max-age=86400";
  }
  location /api/ {
    proxy_pass http://$backend_upstream$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_connect_timeout 10s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
  }
  location / {
    try_files $uri $uri/ /index.html;
  }
  location = /index.html {
    add_header Cache-Control "no-store";
  }
}
