spring.application.name=Nothing Backend
server.port=${PORT:8080}
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/nothing}
spring.datasource.username=${DATABASE_USER:nothing}
spring.datasource.password=${DATABASE_PASSWORD}
spring.jpa.hibernate.ddl-auto=${HIBERNATE_DDL_AUTO:update}
spring.jpa.open-in-view=false
server.error.include-stacktrace=never
server.error.include-message=never
product.image=${PRODUCT_IMAGE_PATH:images/}
image.base.url=${IMAGE_BASE_URL:http://localhost:8080/images}
spring.app.jwtSecret=${JWT_SECRET}
spring.app.jwtExpirationMs=${JWT_EXPIRATION_MS:86400000}
spring.ecom.app.jwtCookieName=nothingSession
# For HTTPS deployments behind a reverse proxy, set JWT_COOKIE_SECURE=true
stripe.secret.key=${STRIPE_SECRET_KEY:}
frontend.url=${FRONTEND_URL:http://localhost:8000/}
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.security.protocol=${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
spring.kafka.properties.sasl.mechanism=${KAFKA_SASL_MECHANISM:PLAIN}
spring.kafka.properties.sasl.jaas.config=${KAFKA_SASL_JAAS_CONFIG:}
spring.kafka.consumer.group-id=nothing-search-indexer
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.listener.ack-mode=record
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
nothing.events.topic=${EVENTS_TOPIC:nothing.events}
nothing.search.url=${OPENSEARCH_URL:http://localhost:9200}
nothing.search.username=${OPENSEARCH_USER:}
nothing.search.password=${OPENSEARCH_PASSWORD:}
management.server.port=${MANAGEMENT_PORT:8081}
management.endpoints.web.exposure.include=health,info,prometheus
management.metrics.tags.application=nothing-backend

# Only administrator-approved GSTIN accounts receive a backend-enforced cart discount.
nothing.retailer.discount-percent=${RETAILER_DISCOUNT_PERCENT:10}

stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET:}
stripe.success.url=${STRIPE_SUCCESS_URL:http://localhost:8000/?checkout=stripe-success}
stripe.cancel.url=${STRIPE_CANCEL_URL:http://localhost:8000/?checkout=stripe-cancel}

# Real mailbox ownership proof for new registrations.
# smtp (default) or gmail-api (Google Cloud OAuth2 with gmail.send only).
nothing.mail.provider=${MAIL_PROVIDER:smtp}
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USER:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
nothing.mail.from=${EMAIL_FROM:}

# Only start RabbitMQ email consumption after configuring the chosen real mail provider.
nothing.notifications.mail-enabled=${MAIL_NOTIFICATIONS_ENABLED:false}

# The SMTP bean is optional for local API/monitoring availability; signup still fails closed without SMTP.
management.health.mail.enabled=${MAIL_HEALTH_ENABLED:false}

# Bounded worker and connection pools, tuned by deployment environment.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:16}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT_MS:10000}
server.tomcat.threads.max=${HTTP_MAX_THREADS:100}
server.tomcat.accept-count=${HTTP_ACCEPT_COUNT:150}
server.tomcat.connection-timeout=${HTTP_CONNECTION_TIMEOUT:10s}
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.block.ms=5000
spring.kafka.producer.properties.request.timeout.ms=10000
spring.kafka.producer.properties.delivery.timeout.ms=30000
management.endpoint.health.show-components=always
management.endpoint.health.show-details=never

# Replica-friendly graceful shutdown and management probes.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
management.endpoint.health.probes.enabled=true

# Rabbit events are a wake-up trigger; PostgreSQL-persisted email jobs are the
# recovery path if a queue message is lost. Do not hot-loop failed messages.
spring.rabbitmq.listener.simple.default-requeue-rejected=false
