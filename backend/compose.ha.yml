# Disposable multi-replica TEST/DEMO deployment. Single-node brokers are not highly available.
# From repo root: docker compose -f backend/compose.ha.yml --env-file backend/.env up -d --build --scale app=3
name: nothing-ha
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: nothing
      POSTGRES_USER: nothing
      POSTGRES_PASSWORD: ${LOCAL_DB_PASSWORD:?Set LOCAL_DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U nothing -d nothing"]
      interval: 5s
      retries: 20
    volumes: [pgdata:/var/lib/postgresql/data]
  kafka:
    image: apache/kafka:3.8.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
  opensearch:
    image: opensearchproject/opensearch:2.17.1
    environment:
      discovery.type: single-node
      plugins.security.disabled: 'true'
      DISABLE_INSTALL_DEMO_CONFIG: 'true'
      OPENSEARCH_JAVA_OPTS: '-Xms512m -Xmx512m'
    volumes: [searchdata:/usr/share/opensearch/data]
  rabbitmq:
    image: rabbitmq:3.13-management
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: nothing
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD}
    volumes:
      - rabbitdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 6s
      retries: 8
      start_period: 15s
  app:
    build: .
    expose: ["8080", "8081"]
    restart: unless-stopped
    stop_grace_period: 40s
    deploy:
      replicas: 3
      resources:
        limits:
          memory: 960M
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:8081/actuator/health/liveness"]
      interval: 10s
      timeout: 4s
      retries: 5
      start_period: 80s
    environment:
      DATABASE_URL: ${DATABASE_URL:-jdbc:postgresql://postgres:5432/nothing}
      DATABASE_USER: ${DATABASE_USER:-nothing}
      DATABASE_PASSWORD: ${LOCAL_DB_PASSWORD:?Set LOCAL_DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      JWT_COOKIE_SECURE: ${JWT_COOKIE_SECURE:-false}
      MAIL_HEALTH_ENABLED: ${MAIL_HEALTH_ENABLED:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      EMAIL_FROM: ${EMAIL_FROM:-}
      MAIL_PROVIDER: ${MAIL_PROVIDER:-smtp}
      GMAIL_OAUTH_CLIENT_ID: ${GMAIL_OAUTH_CLIENT_ID:-}
      GMAIL_OAUTH_CLIENT_SECRET: ${GMAIL_OAUTH_CLIENT_SECRET:-}
      GMAIL_OAUTH_REFRESH_TOKEN: ${GMAIL_OAUTH_REFRESH_TOKEN:-}
      MAIL_NOTIFICATIONS_ENABLED: ${MAIL_NOTIFICATIONS_ENABLED:-false}
      NOTIFICATION_POLL_MS: ${NOTIFICATION_POLL_MS:-5000}
      NOTIFICATION_BATCH_SIZE: ${NOTIFICATION_BATCH_SIZE:-12}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      RETAILER_DISCOUNT_PERCENT: ${RETAILER_DISCOUNT_PERCENT:-10}
      HIBERNATE_DDL_AUTO: update
      DB_POOL_MAX: ${DB_POOL_MAX:-8}
      DB_POOL_MIN_IDLE: ${DB_POOL_MIN_IDLE:-1}
      HTTP_MAX_THREADS: ${HTTP_MAX_THREADS:-80}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: nothing
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD}
      SEED_COFFEE_CATALOG: 'false'
      SEED_OFFERS: ${SEED_OFFERS:-true}
      SEED_RETAIL_CATALOG: ${SEED_RETAIL_CATALOG:-false}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_SUCCESS_URL: ${STRIPE_SUCCESS_URL:-http://localhost:8000/?checkout=stripe-success}
      STRIPE_CANCEL_URL: ${STRIPE_CANCEL_URL:-http://localhost:8000/?checkout=stripe-cancel}
      FRONTEND_URL: http://localhost:8000/
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      KAFKA_SECURITY_PROTOCOL: ${KAFKA_SECURITY_PROTOCOL:-PLAINTEXT}
      KAFKA_SASL_MECHANISM: ${KAFKA_SASL_MECHANISM:-SCRAM-SHA-256}
      KAFKA_SASL_JAAS_CONFIG: ${KAFKA_SASL_JAAS_CONFIG:-}
      OPENSEARCH_URL: ${OPENSEARCH_URL:-http://opensearch:9200}
      OPENSEARCH_USER: ${OPENSEARCH_USER:-}
      OPENSEARCH_PASSWORD: ${OPENSEARCH_PASSWORD:-}
    depends_on:
      postgres: {condition: service_healthy}
      kafka: {condition: service_started}
      opensearch: {condition: service_started}
      rabbitmq: {condition: service_healthy}
  frontend:
    image: nginx:1.28-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    volumes:
      - ../nothing-coffee:/usr/share/nginx/html:ro
      - ./nginx.ha-http.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx.ha-proxy.inc:/etc/nginx/nothing-api-proxy.inc:ro
    ports:
      - "127.0.0.1:${FRONTEND_HTTP_PORT:-8000}:80"
  pgadmin:
    image: dpage/pgadmin4:8.14
    profiles: ["dbadmin"]
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@example.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-}
      PGADMIN_CONFIG_ENHANCED_COOKIE_PROTECTION: "True"
      PGADMIN_CONFIG_LOGIN_BANNER: "'LOCAL DATABASE ADMINISTRATION ONLY'"
    ports:
      - "127.0.0.1:${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmindata:/var/lib/pgadmin
    restart: unless-stopped
  prometheus:
    profiles: ["monitoring"]
    image: prom/prometheus:v2.55.1
    volumes: ["./infrastructure/monitoring/prometheus.ha.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["127.0.0.1:9090:9090"]
  grafana:
    profiles: ["monitoring"]
    image: grafana/grafana:11.3.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD}
    volumes: ["./infrastructure/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro"]
    ports: ["127.0.0.1:3000:3000"]
volumes:
  pgdata:
  searchdata:
  pgadmindata:
  rabbitdata:
